name: badge
description: "Inline coloured label, e.g. a status marker."
form: inline
params:
  accent: { type: token, required: false, default: accent }
slots:
  children: true
# `{}` terminates the colour macro's name so it does not run into the text.
# Both brackets sit after the colour switch (inside its scope), so `[` and `]`
# render in the same colour instead of `[` in body colour and `]` in accent.
emits: "\\textbf{{{accent}}{}[\\,{{children}}\\,]}"
example: |
  Status: :badge[DRAFT]
